name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: SWA Deployment Preflight
        shell: bash
        env:
          TOKEN_PRIMARY: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_BUSH_0C3F5A800 }}
          TOKEN_FALLBACK: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Run ID: $GITHUB_RUN_ID"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"

          has_primary=false
          has_fallback=false

          if [ -n "${TOKEN_PRIMARY:-}" ]; then
            has_primary=true
          fi

          if [ -n "${TOKEN_FALLBACK:-}" ]; then
            has_fallback=true
          fi

          echo "::notice title=SWA Token Check::primary_present=$has_primary fallback_present=$has_fallback"

          if [ "$has_primary" = true ] && [ "$has_fallback" = true ]; then
            echo "::error::Both SWA token secrets are set. Keep only AZURE_STATIC_WEB_APPS_API_TOKEN to avoid deploying with the wrong token."
            exit 1
          fi

          if [ "$has_primary" = false ] && [ "$has_fallback" = false ]; then
            echo "::error::No SWA token found. Configure AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_BUSH_0C3F5A800 or AZURE_STATIC_WEB_APPS_API_TOKEN in GitHub Secrets."
            exit 1
          fi
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "build" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          app_location: "/"
          action: "close"
